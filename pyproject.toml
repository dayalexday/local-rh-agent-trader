[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rh-agent"
version = "0.1.0"
description = "Local Ollama agent wired to Robinhood Trading MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "yfinance>=0.2.40",
  "pandas>=2.0",
  "lxml>=4.9",
  "requests>=2.31",
]

[project.scripts]
local-rh-agent = "local_rh_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
