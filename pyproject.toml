[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rh-agent"
version = "0.2.0"
description = "Local multi-agent momentum book with a guarded Robinhood executor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "yfinance>=0.2.40",
  "pandas>=2.0",
  "lxml>=4.9",
  "requests>=2.31",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
local-rh-agent = "local_rh_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
