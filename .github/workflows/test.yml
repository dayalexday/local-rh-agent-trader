name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN: "1"
      MODEL_PROVIDER: mock
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Offline team dry-run
        run: python -m local_rh_agent team --dry-run --provider mock --offline --buying-power 10000
      - name: Backtest
        run: python -m local_rh_agent backtest --offline
